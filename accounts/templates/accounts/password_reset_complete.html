{% extends "accounts/base.html" %}
{% load crispy_forms_tags %}

{% block page_title %}Finish resetting your password{% endblock %}

{% block page_content %}
    <form method="post" class="flex flex-col gap-2">
        {% csrf_token %}
        {% crispy form %}
        <button type="submit" class="btn btn-primary w-full mt-2">Set password</button>
    </form>
{% endblock %}
