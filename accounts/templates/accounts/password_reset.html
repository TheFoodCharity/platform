{% extends "accounts/base.html" %}
{% load crispy_forms_tags %}

{% block page_title %}Forgot your password?{% endblock %}

{% block page_content %}
    <form method="post" class="flex flex-col gap-2">
        {% csrf_token %}
        {% crispy form %}
        <button type="submit" class="btn btn-primary w-full mt-2">Reset password</button>
    </form>

    <p class="mt-4 text-center text-sm text-base-content/60">
        Remembered your password?
        <a href="{% url 'accounts:login' %}" class="link link-primary font-semibold">Back to sign in</a>
    </p>
{% endblock %}
