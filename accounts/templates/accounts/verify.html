{% extends "base.html" %}

{% block content %}
    <div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
        <div class="sm:mx-auto sm:w-full sm:max-w-sm">
            <h2 class="mt-10 text-center text-2xl/9 font-bold tracking-tight text-gray-900">
                Verify your email
            </h2>
        </div>

        <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
            <div class="text-center">
                {% if messages %}
                    {% for message in messages %}
                        <p>{{ message }}</p>
                    {% endfor %}
                {% endif %}

                <p>Enter the 6-character code sent to your email.</p>
            </div>

            <form method="post" class="mt-5 space-y-6">
                {% csrf_token %}

                {{ form }}

                <div class="flex flex-col gap-y-2">
                    <button type="submit" class="btn btn-primary w-full">Verify</button>
                    <button type="submit" form="resend" class="btn btn-soft btn-primary w-full">
                        Send a new code
                    </button>
                </div>
            </form>

            <form id="resend" method="post" action="{% url 'accounts:verify_resend' %}">
                {% csrf_token %}
            </form>
        </div>
    </div>
{% endblock %}
