{% extends "accounts/base.html" %}
{% load crispy_forms_tags %}

{% block page_title %}Verify your email{% endblock %}

{% block page_content %}
    <p class="text-center text-sm text-base-content/60 mb-4">Enter the 6-character code sent to your email.</p>

    <form method="post" class="flex flex-col gap-2">
        {% csrf_token %}
        {% crispy form %}
        <div class="flex flex-col gap-2 mt-2">
            <button type="submit" class="btn btn-primary w-full">Verify</button>
            <button type="button" class="btn btn-soft btn-primary w-full" hx-post="{% url 'accounts:verify_resend' %}">
                Send a new code
            </button>
        </div>
    </form>
{% endblock %}
