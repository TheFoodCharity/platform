{% extends "base.html" %}

{% block content %}
    <main class="min-h-screen bg-base-200 px-4 py-10">
        <div class="card card-border bg-base-100 mx-auto max-w-lg">
            <div class="card-body gap-6">
                <div>
                    <h2 class="card-title text-2xl">{% block page_title %}{% endblock %}</h2>
                    <p class="text-base-content/60 text-sm mt-1">{% block page_subtitle %}{% endblock %}</p>
                </div>

                {% block page_content %}{% endblock %}

                <div class="card-actions justify-center border-t border-base-200 pt-2">
                    {% block page_actions %}{% endblock %}
                </div>
            </div>
        </div>
    </main>
{% endblock %}
