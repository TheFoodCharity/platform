{% extends "base.html" %}

{% block extra_head %}
  {% include "collaborations/_styles.html" %}
{% endblock %}

{% block content %}
<main class="collab-shell" style="max-width: 820px;">
  <header class="collab-page-header">
    <div>
      <h1>Request New Collaboration</h1>
      <p>Submit the request details for admin review.</p>
    </div>
  </header>

  <form class="collab-form collab-card" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Submit Request</button>
  </form>

  <hr>

  <a class="collab-link" href="{% url 'collaborations:list' %}">Back to Collaborations</a>
</main>
{% endblock %}
