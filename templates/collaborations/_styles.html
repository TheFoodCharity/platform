<!--TODO: Use consistent css file, this is just for easier viewing -->

<style>
  .collab-shell {
    max-width: 1120px;
    margin: 32px auto;
    padding: 0 24px 48px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #111827;
  }

  .collab-page-header {
    display: flex;
    justify-content: space-between;
    gap: 24px;
    align-items: flex-start;
    margin-bottom: 28px;
  }

  .collab-page-header h1,
  .collab-card h1,
  .collab-card h2,
  .collab-card h3 {
    margin: 0;
  }

  .collab-page-header p,
  .collab-muted {
    color: #4b5563;
    margin: 8px 0 0;
  }

  .collab-link {
    color: #111827;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .collab-button,
  .collab-form button,
  .collab-action-button {
    display: inline-block;
    border: 1px solid #111827;
    border-radius: 6px;
    padding: 8px 12px;
    background: #111827;
    color: #ffffff;
    font: inherit;
    line-height: 1.2;
    text-decoration: none;
    cursor: pointer;
  }

  .collab-button-secondary,
  .collab-action-button-secondary,
  .collab-form .collab-action-button-secondary {
    background: #ffffff;
    color: #111827;
  }

  .collab-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
  }

  .collab-card {
    border: 1px solid #d1d5db;
    border-radius: 8px;
    padding: 20px;
    background: #ffffff;
  }

  .collab-subpanel {
    border-top: 1px solid #e5e7eb;
    margin-top: 16px;
    padding-top: 16px;
  }

  .collab-section {
    margin-top: 24px;
  }

  .collab-section-title {
    margin: 0 0 12px;
    font-size: 1.15rem;
  }

  .collab-detail-layout {
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr);
    gap: 28px;
    margin-top: 24px;
  }

  .collab-sidebar {
    border: 1px solid #d1d5db;
    border-radius: 8px;
    padding: 14px;
    align-self: start;
    position: sticky;
    top: 24px;
  }

  .collab-sidebar a {
    display: block;
    padding: 8px 10px;
    border-radius: 6px;
    color: #111827;
    text-decoration: none;
  }

  .collab-sidebar a:hover {
    background: #f3f4f6;
  }

  .collab-sidebar a.collab-placeholder-link {
    color: #6b7280;
  }

  .collab-content {
    min-width: 0;
  }

  .collab-meta {
    display: grid;
    grid-template-columns: minmax(150px, 220px) minmax(0, 1fr);
    gap: 10px 18px;
    margin: 16px 0 0;
  }

  .collab-meta dt {
    font-weight: 700;
    color: #374151;
  }

  .collab-meta dd {
    margin: 0;
    min-width: 0;
  }

  .collab-status {
    display: inline-block;
    border: 1px solid #9ca3af;
    border-radius: 999px;
    padding: 3px 9px;
    font-size: 0.9rem;
    color: #374151;
    background: #f9fafb;
  }

  .collab-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
  }

  .collab-table th,
  .collab-table td {
    text-align: left;
    border-bottom: 1px solid #e5e7eb;
    padding: 10px 8px;
    vertical-align: top;
  }

  .collab-table th {
    color: #374151;
    font-weight: 700;
    background: #f9fafb;
  }

  .collab-form {
    margin-top: 16px;
  }

  .collab-form p {
    margin: 0 0 14px;
  }

  .collab-form label {
    display: block;
    margin-bottom: 5px;
    font-weight: 700;
    color: #374151;
  }

  .collab-form input,
  .collab-form select,
  .collab-form textarea {
    width: 100%;
    max-width: 720px;
    box-sizing: border-box;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    padding: 8px 10px;
    font: inherit;
    background: #ffffff;
  }

  .collab-empty {
    border: 1px dashed #cbd5e1;
    border-radius: 8px;
    padding: 16px;
    color: #4b5563;
    background: #f9fafb;
  }

  .collab-chat-log {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 18px;
  }

  .collab-chat-message {
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 12px 14px;
    background: #ffffff;
  }

  .collab-chat-message p {
    margin: 8px 0 0;
  }

  .collab-chat-meta {
    color: #4b5563;
    font-size: 0.9rem;
  }

  .collab-hero-placeholder {
    border: 1px solid #d1d5db;
    border-radius: 8px;
    padding: 28px;
    margin-bottom: 20px;
    background: #f9fafb;
  }

  @media (max-width: 760px) {
    .collab-page-header,
    .collab-detail-layout {
      display: block;
    }

    .collab-sidebar {
      position: static;
      margin-bottom: 18px;
    }

    .collab-meta {
      grid-template-columns: 1fr;
      gap: 4px;
    }
  }
</style>
