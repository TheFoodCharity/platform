<section id="links" class="rounded-2xl border border-base-300 bg-white p-6 shadow-sm">
  <h2 class="text-2xl font-bold text-slate-950">Linked Records</h2>
  <div class="mt-6 space-y-3">
    {% for linked_object in linked_objects %}
      <article class="rounded-xl border border-base-300 bg-base-100 p-4">
        <h3 class="text-xl font-bold text-slate-950">{{ linked_object.label }}</h3>
        <p class="mt-2 text-sm text-slate-600">
          <span class="font-semibold text-slate-900">Type:</span>
          {{ linked_object.content_type }}
        </p>
        <p class="mt-2 text-slate-950">{{ linked_object.notes|linebreaksbr }}</p>
      </article>
    {% empty %}
      <div class="rounded-xl border border-dashed border-base-300 bg-base-100 p-8 text-center text-slate-600">
        No linked records yet.
      </div>
    {% endfor %}
  </div>
</section>
