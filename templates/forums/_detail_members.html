<section id="members" class="rounded-2xl border border-base-300 bg-white p-6 shadow-sm">
  <h2 class="text-2xl font-bold text-slate-950">Members</h2>
  <div class="mt-6 overflow-x-auto rounded-xl border border-base-300">
    <table class="table">
      <thead>
        <tr>
          <th>User</th>
          <th>Organization</th>
          <th>Role</th>
        </tr>
      </thead>
      <tbody>
        {% for member in member_rows %}
          <tr>
            <td>{{ member.name }}</td>
            <td>
              {% if member.organization %}
                {{ member.organization.name }}
              {% else %}
                N/A
              {% endif %}
            </td>
            <td><span class="badge badge-ghost">{{ member.role }}</span></td>
          </tr>
        {% empty %}
          <tr>
            <td class="py-8 text-center text-slate-600" colspan="3">No user members yet.</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</section>
