{% extends "base_app.html" %}

{% block page_body %}
    <div class="grid place-items-center">
        <section class="w-full max-w-xl rounded-2xl border border-base-300 bg-white p-8 text-center shadow-sm">
            <div class="mx-auto grid h-16 w-16 place-items-center rounded-full bg-primary/10 text-primary">
                <span class="material-symbols-rounded text-4xl">check_circle</span>
            </div>
            <h1 class="mt-6 text-4xl font-bold text-slate-950">Request Submitted</h1>
            <p class="mt-3 text-lg text-slate-600">
                Thank you. Your food request has been submitted for review.
            </p>
            <p class="mt-4 text-sm font-semibold uppercase tracking-wide text-primary">
                Request number: {{ request_id }}
            </p>
            <a class="btn btn-primary mt-8" href="{% url 'donations:available_list' %}">
                View Available Donations
            </a>
        </section>
    </div>
{% endblock %}
