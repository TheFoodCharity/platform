{% extends "base_app.html" %}
{% load crispy_forms_tags %}

{% block page_body %}
    <div class="mx-auto max-w-3xl">
        <div class="mb-8">
            <p class="text-sm font-semibold uppercase tracking-wide text-primary">Receiver request</p>
            <h1 class="mt-2 text-4xl font-bold text-slate-950">Request Food</h1>
            <p class="mt-3 text-lg text-slate-600">
                You are requesting <strong class="text-slate-900">{{ donation.food_type_display }}</strong>.
            </p>
        </div>

        <form method="post" class="space-y-6">
            {% csrf_token %}

            {% crispy form %}

            <div class="mt-8 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
                <a class="btn btn-outline btn-primary" href="{% url 'donations:available_detail' donation.id %}">
                    Back to Donation
                </a>
                <button type="submit" class="btn btn-primary">
                    <span class="material-symbols-rounded">send</span>
                    Submit Request
                </button>
            </div>
        </form>
    </div>
{% endblock %}
