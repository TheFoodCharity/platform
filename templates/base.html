{% load django_htmx static tailwind_tags %}
<!doctype html>
<html lang="en" data-theme="fcacp" class="h-full">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FCACP</title>
    {% block extra_head %}{% endblock %}
    {% tailwind_css %}
    {% htmx_script %}
    <script type="module" src="{% static "js/theme.js" %}"></script>
    <script type="module" src="{% static "js/toasts.js" %}"></script>

    <script type="module">
      const CSRF_COOKIE_RE = /csrftoken=([^;]+)/;
      document.addEventListener('htmx:configRequest', (event) => {
        const token = document.cookie.match(CSRF_COOKIE_RE)?.[1];
        if (token) event.detail.headers['X-CSRFToken'] = token;
      });
    </script>
</head>
<body class="h-full bg-white text-slate-900 antialiased" hx-boost="true">
<div id="toasts" class="toast toast-top toast-end z-50">
    {% include "components/_toasts.html" %}
</div>
{% block content %}{% endblock %}
</body>
</html>
