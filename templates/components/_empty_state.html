{# Usage: {% include "components/_empty_state.html" with message="No items yet." icon="inbox" action_label="Add one" action_href=url %} #}
<div class="flex flex-col items-center justify-center py-16 text-base-content/50">
    {% if icon %}
        <span class="material-symbols-rounded text-5xl mb-3">{{ icon }}</span>
    {% endif %}
    <p class="text-lg">{{ message }}</p>
    {% if action_label and action_href %}
        <a href="{{ action_href }}" class="btn btn-primary mt-4">{{ action_label }}</a>
    {% endif %}
</div>
