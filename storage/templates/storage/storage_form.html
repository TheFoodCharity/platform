{% extends "base_app.html" %}
{% load crispy_forms_tags %}

{% block page_title %}{{ title }}{% endblock %}

{% block page_body %}
    <h2 class="text-2xl font-semibold mb-6">{{ title }}</h2>
    <form method="post">
        {% csrf_token %}
        {% crispy form %}
        <div class="flex justify-end gap-2 mt-4">
            <button type="submit" class="btn btn-primary">Save Storage Location</button>
            <a href="{% url 'storage:list' %}" class="btn btn-ghost">Cancel</a>
        </div>
    </form>
{% endblock %}
