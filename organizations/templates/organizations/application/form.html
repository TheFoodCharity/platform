{% extends "organizations/application/base.html" %}

{% block apply_content %}
    <h2>{{ section_title }}</h2>

    <form method="post">
        {% csrf_token %}
        {{ form }}

        <div class="flex justify-between">
            <a class="btn btn-soft" href="{% url 'organizations:application' organization.pk %}">Back to application</a>
            <button type="submit" class="btn btn-primary"
                    {% if not organization.is_editable %}disabled aria-disabled="true"{% endif %}>
                Save
            </button>
        </div>
    </form>
{% endblock %}
