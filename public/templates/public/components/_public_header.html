{% load static %}
<header class="relative z-50 mx-auto flex w-full max-w-[1720px] flex-col gap-4 px-6 py-4 md:h-24 md:flex-row md:items-center md:justify-between md:gap-0 md:py-0 lg:px-8">
    <div class="flex w-full items-center gap-x-5 md:h-full md:w-auto">
        <a href="{% url 'home' %}" class="flex items-center py-0 md:h-full md:py-4">
            <img src="{% static 'public/images/logo_w_text_primary.svg' %}" alt="The Food Charity Association of Canada logo" class="h-full w-auto max-h-16">
        </a>

        <nav class="hidden h-full items-center gap-10 text-base font-medium leading-none md:flex md:text-lg">
            <a href="#" class="text-primary transition-colors hover:opacity-80">Product</a>
            <a href="#" class="text-primary transition-colors hover:opacity-80">Solutions</a>
            <a href="#" class="text-primary transition-colors hover:opacity-80">Support</a>
            <a href="#" class="text-primary transition-colors hover:opacity-80">Pricing</a>
        </nav>
    </div>

    <div class="flex w-full items-center justify-between gap-3 text-sm font-medium md:h-full md:w-auto md:justify-end md:gap-6 md:text-lg">
        <svg class="hidden h-6 w-6 md:block stroke-primary" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M3 12h18"></path>
            <path d="M12 3a14.5 14.5 0 0 1 0 18"></path>
            <path d="M12 3a14.5 14.5 0 0 0 0 18"></path>
        </svg>
        <a href="#" class="hidden text-primary transition-colors hover:opacity-80 md:inline">Contact Sales</a>
        <a href="#" class="hidden text-primary transition-colors hover:opacity-80 md:inline">Log In</a>
        <a href="#" class="btn btn-primary text-base font-bold">Get Started</a>

        <details class="md:hidden group">
            <summary class="flex h-10 w-10 cursor-pointer list-none items-center justify-center rounded text-primary focus:outline-none">
                <span class="sr-only">Toggle menu</span>

                <svg class="block h-7 w-7 group-open:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>

                <svg class="hidden h-7 w-7 group-open:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </summary>

            <nav class="absolute left-0 right-0 top-full z-40 w-full border-t border-slate-200 bg-white px-6 py-4 text-primary">
                <div class="flex flex-col space-y-2">
                    <a href="#" class="block rounded-lg px-4 py-3 text-lg  hover:bg-slate-50">Product</a>
                    <a href="#" class="block rounded-lg px-4 py-3 text-lg  hover:bg-slate-50">Solutions</a>
                    <a href="#" class="block rounded-lg px-4 py-3 text-lg  hover:bg-slate-50">Support</a>
                    <a href="#" class="block rounded-lg px-4 py-3 text-lg  hover:bg-slate-50">Pricing</a>

                    <hr class="my-2 border-slate-100">

                    <a href="#" class="block rounded-lg px-4 py-3 text-lg  hover:bg-slate-50">Contact Sales</a>
                    <a href="#" class="block rounded-lg px-4 py-3 text-lg  hover:bg-slate-50">Log In</a>
                </div>
            </nav>
        </details>
    </div>
</header>
