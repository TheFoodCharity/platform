{% load static %}
<header id="public-site-header" class="sticky top-0 z-50 w-full bg-white shadow-sm">
    <div class="navbar min-h-0 py-4 px-8 justify-between items-center max-w-screen-xl mx-auto">

        <!-- LEFT -->
        <div class="flex items-center space-x-14">
            <a href="{% url 'home' %}" class="flex items-center">
                <img src="{% static 'public/images/logo_primary.svg' %}" class="h-10 md:hidden">
                <img src="{% static 'public/images/logo_w_text_primary.svg' %}" class="hidden md:block h-14">
            </a>

            <!-- NAV -->
            <nav class="hidden md:flex items-center space-x-12 text-primary font-medium tracking-wide">
                <a href="{% url 'food_help_map' %}" class="hover:opacity-60 transition whitespace-nowrap">Food Map</a>
                <a href="{% url 'storage:list' %}" class="hover:opacity-60 transition whitespace-nowrap">Storage</a>
                <a href="{% url 'donations:available_list' %}" class="hover:opacity-60 transition whitespace-nowrap">Listings</a>
            </nav>
        </div>

        <!-- RIGHT -->
        <div class="flex items-center flex-nowrap text-primary font-medium tracking-wide">
            <div class="flex items-center space-x-8">
                {% if user.is_authenticated %}
                    <a href="{% url 'dashboard' %}" class="text-sm hover:opacity-70 transition whitespace-nowrap">
                        Dashboard
                    </a>
                {% else %}
                    <a href="{% url 'accounts:register' %}" class="hidden md:inline text-sm hover:opacity-70 transition whitespace-nowrap">
                        Register
                    </a>
                    <a href="{% url 'accounts:login' %}" class="px-3 py-1.5 text-sm rounded-md border border-primary hover:bg-primary hover:text-white transition whitespace-nowrap">
                        Log In
                    </a>
                {% endif %}
            </div>

            <!-- CTA -->
            <div class="ml-8">
                <a href="{% url 'donations:create' %}" class="px-5 py-2 rounded-md bg-primary text-white text-sm font-semibold hover:opacity-90 transition whitespace-nowrap">
                    Donate
                </a>
            </div>

            <!-- MOBILE -->
            <details class="md:hidden relative ml-4">
                <summary class="btn btn-ghost">☰</summary>
                <div class="absolute right-0 mt-3 w-56 bg-white shadow-lg rounded-lg p-3 text-primary">
                    <a href="{% url 'food_help_map' %}" class="block p-2 hover:bg-base-200 rounded">Food Map</a>
                    <a href="{% url 'storage:list' %}" class="block p-2 hover:bg-base-200 rounded">Storage</a>
                    <a href="{% url 'donations:available_list' %}" class="block p-2 hover:bg-base-200 rounded">Listings</a>
                    <a href="{% url 'donations:create' %}" class="block p-2 font-semibold hover:bg-base-200 rounded">Donate</a>
                    <hr class="my-2">
                    {% if user.is_authenticated %}
                        <a href="{% url 'dashboard' %}" class="block p-2 hover:bg-base-200 rounded">Dashboard</a>
                    {% else %}
                        <a href="{% url 'accounts:register' %}" class="block p-2 hover:bg-base-200 rounded">Register</a>
                        <a href="{% url 'accounts:login' %}" class="block p-2 hover:bg-base-200 rounded">Log In</a>
                    {% endif %}
                </div>
            </details>
        </div>
    </div>
</header>
