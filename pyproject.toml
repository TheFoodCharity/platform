[project]
name = "fcacp"
version = "0.1.0"
description = "The platform for the Food Charity Association of Canada"
authors = [
    { name = "Erryl Galang", email = "egalang6@my.bcit.ca" },
    { name = "Ramandeep Kaur", email = "rramandeepkaur11@my.bcit.ca" },
    { name = "Alex Krantz", email = "alex@krantz.dev" },
    { name = "Jiahong Xu", email = "jiahongxu1997@gmail.com" },
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.4",
]

[dependency-groups]
dev = [
    "prek>=0.3.11",
    "ruff>=0.15.12",
]
prod = [
    "gunicorn>=25.3.0",
]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["C4", "DJ", "E", "F", "I", "LOG", "PTH", "RUF", "TD", "TRY"]
ignore = ["TRY003"]
