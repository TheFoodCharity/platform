[project]
name = "fcacp"
version = "0.1.0"
description = "The platform for the Food Charity Association of Canada"
authors = [
    { name = "Erryl Galang", email = "egalang6@my.bcit.ca" },
    { name = "Ramandeep Kaur", email = "rramandeepkaur11@my.bcit.ca" },
    { name = "Alex Krantz", email = "alex@krantz.dev" },
    { name = "Jiahong Xu", email = "jiahongxu1997@gmail.com" },
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.6",
    "celery>=5.6.3",
    "clamd>=1.0.2",
    "django>=6.0.4",
    "django-crispy-forms>=2.6",
    "rules>=3.5",
    "django-debug-toolbar>=6.3.0",
    "django-htmx>=1.27.0",
    "django-phonenumber-field[phonenumberslite]>=8.4.0",
    "django-storages>=1.14.6",
    "django-tailwind>=4.4.2",
    "psycopg[binary,pool]>=3.3.3",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "redis>=7.4.0",
    "pillow>=12.2.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "cookiecutter>=2.7.1",
    "django-browser-reload>=1.21.0",
    "prek>=0.3.11",
    "ruff>=0.15.12",
]
prod = [
    "gunicorn>=25.3.0",
]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["C4", "DJ", "E", "F", "I", "LOG", "PTH", "RUF", "TD", "TID", "TRY"]
ignore = ["RUF012", "TD003", "TRY003"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"django.contrib.auth.models.User".msg = "Import User from accounts.models instead."
"django.contrib.auth.models.Group".msg = "Import Group from accounts.models instead."
"permissions.registry.register_permission".msg = "Use permissions.register_permission instead."
"permissions.constants.Scope".msg = "Use permissions.Scope instead."
"permissions.constants.SystemCapability".msg = "Use permissions.SystemCapability instead."
"permissions.constants.SystemRole".msg = "Use permissions.SystemRole instead."

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
