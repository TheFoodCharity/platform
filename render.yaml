previews:
  generation: automatic
  expireAfterDays: 3

projects:
  - name: Platform
    environments:
      - name: Production
        networking:
          isolation: enabled
        permissions:
          protection: enabled

        services:
          - name: web
            type: web
            runtime: docker
            region: oregon
            plan: starter

            repo: https://github.com/TheFoodCharity/platform
            branch: ak/deployment # TODO: remove
            autoDeployTrigger: checksPass # TODO: change to "commit"

            renderSubdomainPolicy: disabled
            domains:
              - thefoodcharity.ca

            preDeployCommand: python3 manage.py migrate
            healthCheckPath: /healthz

            envVars:
              - key: SECRET_KEY
                generateValue: true

              - key: DATABASE_URL
                fromDatabase:
                  name: database
                  property: connectionString

              - key: CELERY_BROKER_URL
                fromService:
                  type: keyvalue
                  name: cache
                  property: connectionString

              - key: ALLOWED_HOSTS
                value: thefoodcharity.ca,*.onrender.com

              # TODO: add SMTP settings

          - name: worker
            type: worker
            runtime: docker
            region: oregon
            plan: starter

            repo: https://github.com/TheFoodCharity/platform
            branch: ak/deployment # TODO: remove
            autoDeployTrigger: checksPass # TODO: change to "commit"

            dockerCommand: celery -A fcacp.celery worker -l info

            envVars:
              - key: SECRET_KEY
                generateValue: true

              - key: DATABASE_URL
                fromDatabase:
                  name: database
                  property: connectionString

              - key: CELERY_BROKER_URL
                fromService:
                  type: keyvalue
                  name: cache
                  property: connectionString

              - key: CLAMAV_HOST
                fromService:
                  type: pserv
                  name: clamav
                  property: host

              - key: CLAMAV_PORT
                fromService:
                  type: pserv
                  name: clamav
                  property: port

          - name: clamav
            type: pserv
            runtime: image
            region: oregon
            plan: standard

            image:
              url: docker.io/clamav/clamav:stable

            disk:
              name: signatures
              mountPath: /var/lib/clamav
              sizeGB: 1

          - name: cache
            type: keyvalue
            region: oregon
            plan: starter

            maxmemoryPolicy: allkeys-lru
            ipAllowList: [ ]

        databases:
          - name: database
            region: oregon
            plan: basic-1gb
            diskSizeGB: 15

            previewPlan: basic-256mb
            previewDiskSizeGB: 1

            postgresMajorVersion: '18'
            databaseName: fcacp_prod
            user: fcacp
            ipAllowList: [ ]
