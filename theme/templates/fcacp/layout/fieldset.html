<div class="rounded-2xl border border-base-300 bg-white p-6 shadow-sm {{ fieldset.css_class }}"
     {% if fieldset.css_id %}id="{{ fieldset.css_id }}"{% endif %} {{ fieldset.flat_attrs|safe }}>
    {% if legend %}
        <h2 class="mb-4 text-xl font-bold text-slate-950">{{ legend }}</h2>
    {% endif %}
    <div class="space-y-4">{{ fields|safe }}</div>
</div>
