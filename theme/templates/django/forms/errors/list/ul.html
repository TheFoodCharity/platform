{% if errors|length == 1 %}
    {% with errors|first as error %}
        <p id="{{ errors.field_id }}_error" class="mt-2 text-sm text-red-600">{{ error }}</p>
    {% endwith %}
{% else %}
    <ul class="mt-2 text-sm text-red-700 list-disc space-y-1 pl-5" id="{{ errors.field_id }}_error">
        {% for error in errors %}
            <li>{{ error }}</li>
        {% endfor %}
    </ul>
{% endif %}
